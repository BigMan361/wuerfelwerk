<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151826">
<title>Würfelwerk</title>
<meta name="apple-mobile-web-app-title" content="Würfelwerk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(120% 80% at 50% 0%,#262b45 0%,#151826 60%,#0f111c 100%)}
  body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #wrap{position:relative;width:100%;height:100%}
  canvas{position:absolute;inset:0;display:block;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Würfelwerk Spielfeld"></canvas></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const FONT = "'Fredoka', -apple-system, 'Segoe UI', sans-serif";
const N = 8;

// ------------------------------------------------------------------ Layout
let VW = 0, VH = 0, cell = 40, bx = 0, by = 0, B = 320, trayY = 0, trayH = 0, trayCell = 20;
function layout() {
  const r = wrap.getBoundingClientRect();
  VW = r.width; VH = r.height;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const top = Math.max(96, VH * 0.16);
  B = Math.min(VW - 24, VH * 0.55, 560);
  cell = Math.floor(B / N); B = cell * N;
  bx = Math.round((VW - B) / 2);
  by = Math.round(top);
  trayY = by + B + 16;
  trayH = Math.max(90, VH - trayY - 12);
  trayCell = Math.min(cell * 0.55, trayH / 5.6, VW / 3 / 5.6);
}
addEventListener('resize', layout);
layout();

// ------------------------------------------------------------------ Formen
const SHAPES = [
  [['X'], 0.5],
  [['XX'], 1], [['X','X'], 1],
  [['XXX'], 1], [['X','X','X'], 1],
  [['XXXX'], 0.9], [['X','X','X','X'], 0.9],
  [['XXXXX'], 0.55], [['X','X','X','X','X'], 0.55],
  [['XX','XX'], 1.2],
  [['XXX','XXX','XXX'], 0.45],
  [['XXX','XXX'], 0.6], [['XX','XX','XX'], 0.6],
  [['X.','XX'], 0.8], [['.X','XX'], 0.8], [['XX','X.'], 0.8], [['XX','.X'], 0.8],
  [['X..','X..','XXX'], 0.5], [['..X','..X','XXX'], 0.5], [['XXX','X..','X..'], 0.5], [['XXX','..X','..X'], 0.5],
  [['XXX','.X.'], 0.7], [['.X.','XXX'], 0.7], [['X.','XX','X.'], 0.7], [['.X','XX','.X'], 0.7],
  [['XX.','.XX'], 0.6], [['.XX','XX.'], 0.6], [['X.','XX','.X'], 0.6], [['.X','XX','X.'], 0.6],
  [['X.','X.','XX'], 0.6], [['.X','.X','XX'], 0.6], [['XX','X.','X.'], 0.6], [['XX','.X','.X'], 0.6],
  [['XXX','X..'], 0.6], [['XXX','..X'], 0.6], [['X..','XXX'], 0.6], [['..X','XXX'], 0.6],
];
const PALETTE = ['#ff6b6b', '#ffa94d', '#ffd43b', '#51cf66', '#38d9c9', '#4dabf7', '#9775fa', '#f783ac'];
const TOTALW = SHAPES.reduce((s, x) => s + x[1], 0);

function makePiece(rows, color) {
  const cells = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'X') cells.push([x, y]); }));
  return { rows, cells, w: rows[0].length, h: rows.length, color };
}
function randomPiece() {
  let r = Math.random() * TOTALW;
  for (const [rows, w] of SHAPES) { r -= w; if (r <= 0) return makePiece(rows, Math.floor(Math.random() * PALETTE.length)); }
  return makePiece(SHAPES[0][0], 0);
}

// ------------------------------------------------------------------ Zustand
let grid, tray, score, shown, best, combo, sinceClear, over, overT, newBest;
let drag = null;
let anims = [], clears = [], particles = [], popups = [], shake = 0, flashLines = [];
let confirmRestart = false, muted = false;

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
best = load('wuerfelwerk-best', 0);
muted = load('wuerfelwerk-muted', false);

function emptyGrid() { return Array.from({ length: N }, () => Array(N).fill(0)); }
function newGame() {
  grid = emptyGrid(); score = 0; shown = 0; combo = 0; sinceClear = 0;
  over = false; overT = 0; newBest = false;
  anims = []; clears = []; particles = []; popups = []; flashLines = [];
  tray = [null, null, null]; refill();
  persist();
}
function persist() {
  if (over) { save('wuerfelwerk-game', null); return; }
  save('wuerfelwerk-game', { grid, tray: tray.map(p => p && { rows: p.rows, color: p.color }), score, combo, sinceClear });
}
function restore() {
  const g = load('wuerfelwerk-game', null);
  if (!g || !g.grid) return false;
  grid = g.grid; score = g.score || 0; shown = score; combo = g.combo || 0; sinceClear = g.sinceClear || 0;
  tray = g.tray.map(p => p && makePiece(p.rows, p.color));
  over = false; overT = 0; newBest = false;
  if (tray.every(p => !p)) refill();
  if (!anyMove()) { over = true; }
  return true;
}

function fits(p, gx, gy) {
  for (const [x, y] of p.cells) {
    const X = gx + x, Y = gy + y;
    if (X < 0 || Y < 0 || X >= N || Y >= N || grid[Y][X]) return false;
  }
  return true;
}
function canPlace(p) {
  for (let gy = 0; gy <= N - p.h; gy++) for (let gx = 0; gx <= N - p.w; gx++) if (fits(p, gx, gy)) return true;
  return false;
}
function anyMove() { return tray.some(p => p && canPlace(p)); }
// ---- Intelligente Formauswahl -------------------------------------------
// Die neuen 3 Formen werden passend zum Feld gewählt: Jede Form wird an ihrer
// besten Stelle bewertet (räumt sie Linien? füllt sie Lücken? passt sie bündig?).
// Danach wird sie gedanklich gelegt und die nächste Form passend zum neuen Feld
// gesucht – so ergänzen sich die 3 Formen gegenseitig.
const HELP = 0.8;          // Anteil "schlauer" Formen (Rest: zufällig, aber passend)
const TEMP = 38;           // Zufallsstreuung bei der Auswahl (kleiner = strenger)
const SHAPE_PIECES = SHAPES.map(([rows, w]) => ({ p: makePiece(rows, 0), w }));

function fitsG(g, p, gx, gy) {
  for (const [x, y] of p.cells) {
    const X = gx + x, Y = gy + y;
    if (X < 0 || Y < 0 || X >= N || Y >= N || g[Y][X]) return false;
  }
  return true;
}
function filledAt(g, x, y) { return x < 0 || y < 0 || x >= N || y >= N || g[y][x] !== 0; }
function evalPlacement(g, p, gx, gy) {
  const own = new Set(p.cells.map(([x, y]) => (gy + y) * N + gx + x));
  for (const k of own) g[Math.floor(k / N)][k % N] = 9;
  // Linien
  let lines = 0, nearFull = 0;
  for (let y = 0; y < N; y++) { let c = 0; for (let x = 0; x < N; x++) if (g[y][x]) c++; if (c === N) lines++; else if (c >= N - 2) nearFull += c - (N - 3); }
  for (let x = 0; x < N; x++) { let c = 0; for (let y = 0; y < N; y++) if (g[y][x]) c++; if (c === N) lines++; else if (c >= N - 2) nearFull += c - (N - 3); }
  // Bündigkeit & neue Löcher
  let contact = 0, holes = 0;
  const seen = new Set();
  for (const k of own) {
    const x = k % N, y = Math.floor(k / N);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, nk = ny * N + nx;
      if (own.has(nk)) continue;
      if (filledAt(g, nx, ny)) contact++;
      else if (!seen.has(nk)) {
        seen.add(nk);
        if (filledAt(g, nx + 1, ny) && filledAt(g, nx - 1, ny) && filledAt(g, nx, ny + 1) && filledAt(g, nx, ny - 1)) holes++;
      }
    }
  }
  for (const k of own) g[Math.floor(k / N)][k % N] = 0;
  return lines * 130 + (lines > 1 ? lines * 40 : 0) + nearFull * 6 + contact * 7 - holes * 30 + p.cells.length * 4;
}
function bestSpot(g, p) {
  let best = null;
  for (let gy = 0; gy <= N - p.h; gy++) for (let gx = 0; gx <= N - p.w; gx++) {
    if (!fitsG(g, p, gx, gy)) continue;
    const s = evalPlacement(g, p, gx, gy);
    if (!best || s > best.s) best = { gx, gy, s };
  }
  return best;
}
function applyPlacement(g, p, spot) {
  const ng = g.map(r => r.slice());
  for (const [x, y] of p.cells) ng[spot.gy + y][spot.gx + x] = 1;
  const { rows, cols } = fullLines(ng);
  rows.forEach(y => { for (let x = 0; x < N; x++) ng[y][x] = 0; });
  cols.forEach(x => { for (let y = 0; y < N; y++) ng[y][x] = 0; });
  return ng;
}
function pickFor(g, smart, used) {
  const cands = [];
  for (let i = 0; i < SHAPE_PIECES.length; i++) {
    const { p, w } = SHAPE_PIECES[i];
    const spot = bestSpot(g, p);
    if (!spot) continue;
    cands.push({ i, p, spot, w: w * (used.has(i) ? 0.25 : 1) });
  }
  if (!cands.length) return null;
  let weights;
  if (smart) {
    const max = Math.max(...cands.map(c => c.spot.s));
    weights = cands.map(c => c.w * Math.exp((c.spot.s - max) / TEMP));
  } else weights = cands.map(c => c.w);
  const tot = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (let k = 0; k < cands.length; k++) { r -= weights[k]; if (r <= 0) return cands[k]; }
  return cands[cands.length - 1];
}
function refill() {
  let g = grid.map(r => r.slice());
  const set = [], used = new Set();
  for (let k = 0; k < 3; k++) {
    const smart = k === 0 || Math.random() < HELP;
    const c = pickFor(g, smart, used);
    if (!c) { set.push(randomPiece()); continue; }
    used.add(c.i);
    set.push(makePiece(c.p.rows, Math.floor(Math.random() * PALETTE.length)));
    g = applyPlacement(g, c.p, c.spot);
  }
  // Reihenfolge mischen, damit die "Lösung" nicht immer links liegt
  for (let i = set.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [set[i], set[j]] = [set[j], set[i]]; }
  tray = set;
  tray.forEach((p, i) => anims.push({ kind: 'tray', i, t: 0, d: 0.35 + i * 0.07 }));
}
function fullLines(g) {
  const rows = [], cols = [];
  for (let y = 0; y < N; y++) if (g[y].every(v => v)) rows.push(y);
  for (let x = 0; x < N; x++) { let f = true; for (let y = 0; y < N; y++) if (!g[y][x]) { f = false; break; } if (f) cols.push(x); }
  return { rows, cols };
}
function previewLines(p, gx, gy) {
  const g = grid.map(r => r.slice());
  for (const [x, y] of p.cells) g[gy + y][gx + x] = p.color + 1;
  return fullLines(g);
}

// ------------------------------------------------------------------ Audio
let ac = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, d, type = 'sine', vol = 0.08, delay = 0, slide = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
function sndPick() { tone(660, 0.06, 'triangle', 0.05); }
function sndPlace() { tone(180, 0.09, 'triangle', 0.14); tone(360, 0.05, 'square', 0.02); }
function sndBack() { tone(300, 0.1, 'triangle', 0.05, 0, 200); }
function sndClear(lines, c) {
  const base = Math.min(c, 4);
  for (let i = 0; i < 2 + lines; i++) tone(SCALE[Math.min(SCALE.length - 1, i + base)], 0.22, 'triangle', 0.07, i * 0.06);
}
function sndOver() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.08, i * 0.16)); }

// ------------------------------------------------------------------ Platzieren
function place(p, gx, gy, trayIdx) {
  for (const [x, y] of p.cells) grid[gy + y][gx + x] = p.color + 1;
  tray[trayIdx] = null;
  anims.push({ kind: 'place', cells: p.cells.map(([x, y]) => [gx + x, gy + y]), t: 0, d: 0.22 });
  let gained = p.cells.length;
  const { rows, cols } = fullLines(grid);
  const lines = rows.length + cols.length;
  sndPlace();
  if (lines) {
    combo++; sinceClear = 0;
    const lineBase = [0, 10, 30, 60, 100, 150, 210, 280, 360][Math.min(lines, 8)] * 10 / 1;
    const mult = 1 + (combo - 1) * 0.5;
    const pts = Math.round(lineBase * mult);
    gained += pts;
    const set = new Set();
    rows.forEach(y => { for (let x = 0; x < N; x++) set.add(y * N + x); });
    cols.forEach(x => { for (let y = 0; y < N; y++) set.add(y * N + x); });
    const cx = gx + p.w / 2, cy = gy + p.h / 2;
    set.forEach(k => {
      const x = k % N, y = Math.floor(k / N);
      const col = grid[y][x] - 1;
      const dist = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      clears.push({ x, y, col, t: -dist * 0.03, d: 0.35 });
      grid[y][x] = 0;
    });
    rows.forEach(y => flashLines.push({ r: y, t: 0.35 }));
    cols.forEach(x => flashLines.push({ c: x, t: 0.35 }));
    shake = Math.min(10, 2 + lines * 2);
    sndClear(lines, combo);
    const words = ['', 'Gut!', 'Super!', 'Fantastisch!', 'Unglaublich!', 'Legendär!'];
    const px = bx + (gx + p.w / 2) * cell, py = by + (gy + p.h / 2) * cell;
    popups.push({ x: px, y: py, s: '+' + pts, col: '#ffffff', size: 26, t: 0, d: 1.1 });
    if (lines >= 2) popups.push({ x: VW / 2, y: by + B / 2 - 30, s: words[Math.min(lines, 5)], col: PALETTE[(lines * 2) % 8], size: 36, t: 0, d: 1.2, big: true });
    if (combo >= 2) popups.push({ x: VW / 2, y: by + B / 2 + 14, s: 'Combo x' + combo, col: '#ffd43b', size: 24, t: 0, d: 1.2, big: true });
    if (grid.every(r => r.every(v => !v))) {
      gained += 300;
      popups.push({ x: VW / 2, y: by + B / 2 + 50, s: 'Alles leer! +300', col: '#51cf66', size: 24, t: 0, d: 1.6, big: true });
      [0, 1, 2, 3, 4].forEach(i => tone(SCALE[4 + i % 4], 0.3, 'sine', 0.06, 0.3 + i * 0.08));
    }
  } else {
    sinceClear++;
    if (sinceClear >= 3 && combo > 0) { combo = 0; }
  }
  score += gained;
  if (score > best) { if (!newBest && best > 0) newBest = true; best = score; save('wuerfelwerk-best', best); }
  if (tray.every(x => !x)) refill();
  if (!anyMove()) { over = true; overT = 0; setTimeout(sndOver, 300); }
  persist();
}

// ------------------------------------------------------------------ Eingabe
function slotRect(i) { const w = VW / 3; return { x: i * w, y: trayY, w, h: trayH }; }
function inR(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function btnRestart() { return { x: 14, y: 14, w: 40, h: 40 }; }
function btnSound() { return { x: VW - 54, y: 14, w: 40, h: 40 }; }
function overBtn() { return { x: VW / 2 - 100, y: by + B / 2 + 70, w: 200, h: 52 }; }
function confirmBtns() { return [{ x: VW / 2 - 110, y: VH / 2 + 10, w: 100, h: 46 }, { x: VW / 2 + 10, y: VH / 2 + 10, w: 100, h: 46 }]; }
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function dragOrigin(d) {
  // Linke obere Ecke der gezogenen Form (über dem Finger)
  const lift = d.touch ? cell * 1.6 : cell * 0.6;
  return { x: d.px - d.p.w * cell / 2, y: d.py - d.p.h * cell - lift + (d.touch ? 0 : d.p.h * cell / 2) };
}
function snap(d) {
  const o = dragOrigin(d);
  const gx = Math.round((o.x - bx) / cell), gy = Math.round((o.y - by) / cell);
  return fits(d.p, gx, gy) ? { gx, gy } : null;
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const p = pos(e);
  if (confirmRestart) {
    const [yes, no] = confirmBtns();
    if (inR(p, yes)) { confirmRestart = false; newGame(); }
    else if (inR(p, no) || true) confirmRestart = false;
    return;
  }
  if (inR(p, btnSound())) { muted = !muted; save('wuerfelwerk-muted', muted); if (!muted) tone(880, 0.08); return; }
  if (inR(p, btnRestart())) { if (!over && score > 0) confirmRestart = true; else newGame(); return; }
  if (over) { if (overT > 0.8 && inR(p, overBtn())) newGame(); return; }
  for (let i = 0; i < 3; i++) {
    if (tray[i] && inR(p, slotRect(i))) {
      drag = { i, p: tray[i], px: p.x, py: p.y, id: e.pointerId, touch: e.pointerType !== 'mouse', s: 0 };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      sndPick();
      return;
    }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  const p = pos(e); drag.px = p.x; drag.py = p.y;
}, { passive: false });
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const s = snap(drag);
  if (s) place(drag.p, s.gx, s.gy, drag.i);
  else { anims.push({ kind: 'back', i: drag.i, from: dragOrigin(drag), t: 0, d: 0.18 }); sndBack(); }
  drag = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drag = null; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ------------------------------------------------------------------ Zeichnen
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shadeHex(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const tileCache = {};
function tileColors(ci) {
  if (!tileCache[ci]) {
    const c = PALETTE[ci];
    tileCache[ci] = { base: c, light: shadeHex(c, 0.35), dark: shadeHex(c, -0.3), edge: shadeHex(c, -0.45) };
  }
  return tileCache[ci];
}
function tile(x, y, s, ci, alpha = 1, grey = false) {
  const g = 1.5, r = s * 0.2;
  ctx.globalAlpha = alpha;
  const c = grey ? { base: '#4a5068', light: '#5d647e', dark: '#383d52', edge: '#2c3042' } : tileColors(ci);
  rr(x + g, y + g, s - 2 * g, s - 2 * g, r); ctx.fillStyle = c.edge; ctx.fill();
  rr(x + g, y + g, s - 2 * g, s - 2 * g - s * 0.08, r); ctx.fillStyle = c.base; ctx.fill();
  rr(x + g + s * 0.12, y + g + s * 0.1, s - 2 * g - s * 0.24, s * 0.22, r * 0.6); ctx.fillStyle = c.light; ctx.globalAlpha = alpha * 0.85; ctx.fill();
  ctx.globalAlpha = 1;
}
function emptyCell(x, y, s) {
  rr(x + 1.5, y + 1.5, s - 3, s - 3, s * 0.18);
  ctx.fillStyle = '#1d2133'; ctx.fill();
}
function txt(s, x, y, size, col, align = 'center', weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const back = t => { t = Math.min(1, Math.max(0, t)); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

let clock = 0;
function draw() {
  ctx.clearRect(0, 0, VW, VH);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;

  // Kopfzeile
  txt('BESTWERT', VW / 2, 22, 11, '#8a90b0', 'center', 500);
  txt(String(best), VW / 2, 40, 18, '#ffd43b');
  txt(String(Math.round(shown)), VW / 2, by - 28, Math.min(44, VW * 0.11), '#ffffff');
  // Buttons
  const r1 = btnRestart(), r2 = btnSound();
  [r1, r2].forEach(r => { rr(r.x, r.y, r.w, r.h, 12); ctx.fillStyle = '#23283d'; ctx.fill(); });
  // Neustart-Symbol
  ctx.strokeStyle = '#c5cae6'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(r1.x + 20, r1.y + 20, 9, -Math.PI * 0.35, Math.PI * 1.45); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r1.x + 27, r1.y + 7); ctx.lineTo(r1.x + 28, r1.y + 14); ctx.lineTo(r1.x + 21, r1.y + 14); ctx.stroke();
  // Lautsprecher
  ctx.fillStyle = '#c5cae6';
  ctx.beginPath(); ctx.moveTo(r2.x + 10, r2.y + 16); ctx.lineTo(r2.x + 15, r2.y + 16); ctx.lineTo(r2.x + 21, r2.y + 10);
  ctx.lineTo(r2.x + 21, r2.y + 30); ctx.lineTo(r2.x + 15, r2.y + 24); ctx.lineTo(r2.x + 10, r2.y + 24); ctx.closePath(); ctx.fill();
  if (muted) { ctx.beginPath(); ctx.moveTo(r2.x + 25, r2.y + 15); ctx.lineTo(r2.x + 32, r2.y + 25); ctx.moveTo(r2.x + 32, r2.y + 15); ctx.lineTo(r2.x + 25, r2.y + 25); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(r2.x + 22, r2.y + 20, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(r2.x + 22, r2.y + 20, 11, -0.9, 0.9); ctx.stroke(); }

  // Brett
  ctx.save(); ctx.translate(sx, sy);
  rr(bx - 8, by - 8, B + 16, B + 16, 18); ctx.fillStyle = '#121522'; ctx.fill();
  ctx.strokeStyle = '#2c3250'; ctx.lineWidth = 2; ctx.stroke();

  // Vorschau
  let ghost = null, prev = null;
  if (drag) { ghost = snap(drag); if (ghost) prev = previewLines(drag.p, ghost.gx, ghost.gy); }
  const hlRow = new Set(prev ? prev.rows : []), hlCol = new Set(prev ? prev.cols : []);

  const placeAnim = {};
  for (const a of anims) if (a.kind === 'place') for (const [x, y] of a.cells) placeAnim[y * N + x] = a;
  const overGrey = over ? Math.min(1, overT * 2) : 0;

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const X = bx + x * cell, Y = by + y * cell;
    emptyCell(X, Y, cell);
    const v = grid[y][x];
    if (v) {
      let ci = v - 1;
      if (prev && (hlRow.has(y) || hlCol.has(x))) ci = drag.p.color;
      const a = placeAnim[y * N + x];
      if (a) {
        const k = back(a.t / a.d), s = cell * (0.75 + 0.25 * k);
        tile(X + (cell - s) / 2, Y + (cell - s) / 2, s, ci);
      } else {
        const greyThis = overGrey > 0 && ((x + y) / 14) < overGrey;
        tile(X, Y, cell, ci, 1, greyThis);
      }
    }
  }
  if (ghost) {
    for (const [x, y] of drag.p.cells) tile(bx + (ghost.gx + x) * cell, by + (ghost.gy + y) * cell, cell, drag.p.color, 0.38);
    if (prev) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if ((hlRow.has(y) || hlCol.has(x)) && !grid[y][x] && !drag.p.cells.some(([cx, cy]) => cx + ghost.gx === x && cy + ghost.gy === y)) {
        tile(bx + x * cell, by + y * cell, cell, drag.p.color, 0.5);
      }
    }
  }
  // Linienblitz
  for (const f of flashLines) {
    ctx.globalAlpha = Math.max(0, f.t / 0.35) * 0.55; ctx.fillStyle = '#ffffff';
    if (f.r !== undefined) { rr(bx, by + f.r * cell, B, cell, 8); ctx.fill(); }
    else { rr(bx + f.c * cell, by, cell, B, 8); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // Räumende Steine
  for (const c of clears) {
    if (c.t < 0) { tile(bx + c.x * cell, by + c.y * cell, cell, c.col); continue; }
    const k = c.t / c.d, s = cell * (1 - ease(k));
    ctx.save();
    ctx.translate(bx + c.x * cell + cell / 2, by + c.y * cell + cell / 2);
    ctx.rotate(k * 0.8);
    tile(-s / 2, -s / 2, s, c.col, 1 - k * 0.5);
    ctx.restore();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col; rr(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s, p.s * 0.25); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Ablage
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p || (drag && drag.i === i)) continue;
    const r = slotRect(i);
    let s = trayCell, ox = 0, oy = 0, alpha = canPlace(p) ? 1 : 0.32;
    const ta = anims.find(a => a.kind === 'tray' && a.i === i);
    if (ta) { const k = back(ta.t / ta.d); s *= Math.max(0.01, k); oy = (1 - Math.min(1, ta.t / ta.d)) * 30; }
    const ba = anims.find(a => a.kind === 'back' && a.i === i);
    const cx = r.x + r.w / 2 - p.w * s / 2 + ox, cy = r.y + r.h / 2 - p.h * s / 2 + oy;
    if (ba) {
      const k = ease(ba.t / ba.d);
      const fx = ba.from.x + (cx - ba.from.x) * k, fy = ba.from.y + (cy - ba.from.y) * k;
      const fs = cell + (s - cell) * k;
      for (const [x, y] of p.cells) tile(fx + x * fs, fy + y * fs, fs, p.color);
      continue;
    }
    for (const [x, y] of p.cells) tile(cx + x * s, cy + y * s, s, p.color, alpha);
  }
  // Gezogene Form
  if (drag) {
    const o = dragOrigin(drag);
    const k = ease(drag.s), s = trayCell + (cell - trayCell) * k;
    const ox = drag.px - (drag.px - o.x) * (s / cell), oy = o.y + (1 - k) * (drag.py - o.y) * 0.3;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
    for (const [x, y] of drag.p.cells) tile(ox + x * s, oy + y * s, s, drag.p.color);
    ctx.restore();
  }

  // Popups
  for (const p of popups) {
    const k = p.t / p.d;
    const a = k < 0.15 ? k / 0.15 : k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    const sc = p.big ? back(Math.min(1, p.t / 0.25)) : 1;
    ctx.globalAlpha = Math.max(0, a);
    ctx.save(); ctx.translate(p.x, p.y - k * 40); ctx.scale(sc, sc);
    ctx.font = `700 ${p.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(15,17,28,0.9)'; ctx.strokeText(p.s, 0, 0);
    ctx.fillStyle = p.col; ctx.fillText(p.s, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (over && overT > 0.6) {
    const a = Math.min(1, (overT - 0.6) * 3);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(12,14,24,0.78)'; ctx.fillRect(0, 0, VW, VH);
    txt('Keine Züge mehr', VW / 2, by + B / 2 - 90, 30, '#ffffff');
    txt('PUNKTE', VW / 2, by + B / 2 - 45, 13, '#8a90b0', 'center', 500);
    txt(String(score), VW / 2, by + B / 2 - 15, 44, '#ffffff');
    if (newBest) txt('Neuer Bestwert!', VW / 2, by + B / 2 + 28, 20, '#ffd43b');
    else txt('Bestwert: ' + best, VW / 2, by + B / 2 + 28, 16, '#8a90b0', 'center', 500);
    const b = overBtn();
    rr(b.x, b.y, b.w, b.h, 26); ctx.fillStyle = '#51cf66'; ctx.fill();
    rr(b.x, b.y + b.h - 6, b.w, 6, 3); ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fill();
    txt('Nochmal spielen', VW / 2, b.y + b.h / 2, 20, '#0f2a16');
    ctx.globalAlpha = 1;
  }
  if (confirmRestart) {
    ctx.fillStyle = 'rgba(12,14,24,0.82)'; ctx.fillRect(0, 0, VW, VH);
    txt('Neues Spiel starten?', VW / 2, VH / 2 - 40, 24, '#ffffff');
    txt('Der aktuelle Spielstand geht verloren.', VW / 2, VH / 2 - 12, 14, '#8a90b0', 'center', 500);
    const [y, n] = confirmBtns();
    rr(y.x, y.y, y.w, y.h, 23); ctx.fillStyle = '#ff6b6b'; ctx.fill(); txt('Ja', y.x + y.w / 2, y.y + y.h / 2, 18, '#2a0f0f');
    rr(n.x, n.y, n.w, n.h, 23); ctx.fillStyle = '#2c3250'; ctx.fill(); txt('Nein', n.x + n.w / 2, n.y + n.h / 2, 18, '#ffffff');
  }
}

// ------------------------------------------------------------------ Update
function update(dt) {
  clock += dt;
  if (over) overT += dt;
  if (drag) drag.s = Math.min(1, drag.s + dt * 7);
  for (const a of anims) a.t += dt;
  anims = anims.filter(a => a.t < a.d);
  for (const c of clears) {
    const before = c.t; c.t += dt;
    if (before < 0 && c.t >= 0) {
      const X = bx + c.x * cell + cell / 2, Y = by + c.y * cell + cell / 2;
      for (let i = 0; i < 5; i++) {
        const ang = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
        particles.push({ x: X, y: Y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 80, life: 0.7, max: 0.7, s: cell * (0.12 + Math.random() * 0.15), col: PALETTE[c.col] });
      }
    }
  }
  clears = clears.filter(c => c.t < c.d);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < p.d);
  for (const f of flashLines) f.t -= dt;
  flashLines = flashLines.filter(f => f.t > 0);
  if (shake) { shake = Math.max(0, shake - dt * 30); }
  if (shown < score) shown = Math.min(score, shown + Math.max(1, (score - shown) * dt * 8));
  else shown = score;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
if (!restore()) newGame();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
